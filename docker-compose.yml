services:
  db:
    image: postgres:15-alpine
    container_name: scada-postgres-db
    environment:
      POSTGRES_DB: authDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: siraBende04
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - modbus-net

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: modbus-simulator-hub
    ports:
      - "5020-5030:5020-5030"
    volumes:
      - ./configs:/app/configs
    stdin_open: true
    tty: true
    networks:
      - modbus-net

  django-auth:
    build:
      context: ./django_auth
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: django_auth_service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./django_auth:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=authDB
      - DB_USER=postgres
      - DB_PASSWORD=siraBende04
    depends_on:
      - db
    networks:
      - modbus-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    container_name: modbus-backend
    ports:
      - "8080:8080"
    depends_on:
      - simulator
      - django-auth
    stdin_open: true
    tty: true
    networks:
      - modbus-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - modbus-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - modbus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: modbus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - modbus-net

volumes:
  postgres_data:

networks:
  modbus-net:
    driver: bridge